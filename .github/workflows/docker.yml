# يبني صورة Docker لمونتير ويرفعها إلى ghcr.io عند كل تحديث على main
name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ahmedthyab2017/monteer:latest
            ghcr.io/ahmedthyab2017/monteer:${{ github.sha }}
